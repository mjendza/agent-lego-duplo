name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (syntax check)
        run: npm run build

      - name: Test (hardware-free, no Bluetooth needed)
        run: npm test

      # Non-blocking: picomatch (GHSA-fc5q-39xc-vjpf, all versions affected, no fix yet)
      # comes in via @stoprocent/noble -> patch-package, install-time tooling only.
      # Make this blocking again once a patched release exists.
      - name: Audit production dependencies (report only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
